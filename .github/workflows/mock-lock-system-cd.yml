name: Mock Lock System CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mock-lock-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Before Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Python Syntax
        run: python -m compileall -q app run.py wsgi.py config.py tests

      - name: Run Automated Tests
        run: python -m pytest -q

      - name: Security Checks
        run: |
          bandit -r app -ll
          pip-audit -r requirements.txt

  deploy:
    name: Deploy to Production Server
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - name: Validate Deployment Secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          test -n "$DEPLOY_HOST" || { echo "Missing DEPLOY_HOST secret"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Missing DEPLOY_USER secret"; exit 1; }
          test -n "$DEPLOY_KEY" || { echo "Missing DEPLOY_SSH_KEY secret"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "Missing DEPLOY_PATH secret"; exit 1; }

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: DEPLOY_PATH
          command_timeout: 10m
          script: |
            set -eu

            if [ -z "${DEPLOY_PATH:-}" ]; then
              echo "DEPLOY_PATH is not set on the remote server."
              exit 1
            fi

            cd -- "$DEPLOY_PATH"
            git fetch --prune origin +refs/heads/main:refs/remotes/origin/main
            git checkout -B main refs/remotes/origin/main

            if [ ! -d .venv ]; then
              python3 -m venv .venv
            fi

            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install -r requirements.txt

            if [ ! -f .env ]; then
              echo "Missing .env file in DEPLOY_PATH. Configure SECRET_KEY and FILE_MASTER_KEY first."
              exit 1
            fi

            # Validate application configuration before restarting production.
            .venv/bin/python -c "from app import create_app; create_app()"

            sudo systemctl restart mock-lock-system
            sudo systemctl is-active --quiet mock-lock-system
            curl --fail --silent --show-error http://127.0.0.1:8000/login >/dev/null

            echo "Mock Lock System deployed and health check passed."
