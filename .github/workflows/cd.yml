name: Mock Lock System CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mock-lock-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Before Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit
      - name: Syntax and Tests
        run: |
          python -m compileall -q app run.py config.py tests
          pytest -q
      - name: Security Checks
        run: |
          bandit -r app -ll
          pip-audit -r requirements.txt

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_HOST" || (echo 'Missing DEPLOY_HOST secret' && exit 1)
          test -n "$DEPLOY_USER" || (echo 'Missing DEPLOY_USER secret' && exit 1)
          test -n "$DEPLOY_KEY" || (echo 'Missing DEPLOY_SSH_KEY secret' && exit 1)
          test -n "$DEPLOY_PATH" || (echo 'Missing DEPLOY_PATH secret' && exit 1)
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd '${{ secrets.DEPLOY_PATH }}'
            git fetch origin main
            git reset --hard origin/main
            if [ ! -d .venv ]; then python3 -m venv .venv; fi
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt
            sudo systemctl restart mock-lock-system
            sudo systemctl is-active --quiet mock-lock-system
